<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panopticon</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>
    <header>
      <div>
        <h1>*판옵티콘<span class="accent">.</span></h1>
      </div>
      <div class="header-actions">
        <div id="status" role="status">서버 연결 중…</div>
        <button id="toggle-theme" type="button" aria-pressed="false">라이트모드</button>
      </div>
    </header>

    <form id="controls">
      <input
        id="video"
        aria-label="유튜브 방송 URL 또는 영상 ID"
        placeholder="YouTube 방송 URL 또는 영상 ID"
        required
      >
      <button class="primary" type="submit">감시 시작</button>
      <button id="stop" type="button">중지</button>
    </form>

    <div class="tools">
      <label>
        <input id="autoscroll" type="checkbox" checked>
        채팅 자동 스크롤하기
      </label>
      <form id="name-filter" class="name-filter" role="search">
        <div class="search-modes" role="group" aria-label="검색 대상">
          <button id="search-content" type="button" aria-pressed="false">내용</button>
          <button id="search-person" type="button" aria-pressed="true">버섯이끼</button>
        </div>
        <div class="name-autocomplete">
          <input
            id="filter-name"
            type="text"
            role="combobox"
            aria-label="버섯이끼 이름 검색"
            aria-autocomplete="list"
            aria-controls="name-suggestions"
            aria-expanded="false"
            autocomplete="off"
            placeholder="버섯이끼 이름 검색"
          >
          <ul id="name-suggestions" class="name-suggestions" role="listbox" aria-label="닉네임 자동완성" hidden></ul>
        </div>
        <button id="toggle-name-filter" type="submit" aria-label="검색 필터 켜기" aria-pressed="false" title="검색 필터 켜기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
        </button>
      </form>
    </div>

    <main>
      <section>
        <div class="panel-title">
          <h2>전체 채팅</h2>
          <span id="chat-count" class="count">0개</span>
        </div>
        <div id="chats" class="feed">
          <div class="empty">
            아직 채팅이 없습니다.<br>
            방송 URL을 입력하고 감시를 시작해 주세요.
          </div>
        </div>
      </section>

      <section>
        <div class="panel-title">
          <h2>슈퍼챗</h2>
          <span id="paid-count" class="count">0개</span>
        </div>
        <div class="paid-filters" role="group" aria-label="슈퍼챗 표시 필터">
          <button id="show-unread" type="button" aria-pressed="false">안 읽은 슈퍼챗만 보기</button>
          <button id="show-all" type="button" aria-pressed="true">전체 슈퍼챗 보기</button>
          <button id="export-paid" type="button" disabled>슈퍼챗 내보내기</button>
        </div>
        <div class="paid-sorting" role="group" aria-label="슈퍼챗 정렬">
          <button id="sort-paid-time" type="button" aria-pressed="true">시간 순으로 정렬</button>
          <button id="sort-paid-amount" type="button" aria-pressed="false" title="환율 환산 없이 원래 통화의 숫자 기준으로 정렬">금액 순으로 정렬</button>
          <button id="sort-paid-direction" type="button" aria-label="내림차순으로 전환" aria-pressed="false">오름차순 ↑</button>
        </div>
        <div id="paid" class="feed">
          <div class="empty">슈퍼챗이 도착하면 여기에 표시됩니다.</div>
        </div>
      </section>
    </main>

    <footer>
      Made with ❤️ by <a href="https://github.com/Park-Joonyoung/panopticon">[검열됨]</a>
    </footer>
    <script src="dashboard.js"></script>
  </body>
</html>
